# =====================================================================
#  CASA GRANDE APARTMENTS: WEBSITE INFORMATION
#
#  This one file controls the facts shown across the whole website:
#  contact details, rent, availability, apartment descriptions,
#  amenities and photos. Edit a value here, commit, and every page
#  that uses it updates automatically in a few minutes.
#
#  Rules of thumb
#  - Write TBD for anything not yet confirmed. The site shows a clearly
#    marked placeholder instead of guessing.
#  - Text with a colon (:) or starting with a symbol should go in "quotes".
#  - Photo file names are relative to src/assets/photos/
#    e.g.  exterior/front-entrance.jpg
# =====================================================================

# While true, placeholders and unconfirmed items appear with a yellow
# "to confirm" marker so they are easy to spot.
# Set to false at launch. The build will then stop with a list of
# anything still TBD or unconfirmed, so nothing unverified goes live.
preview_mode: true

property:
  name: Casa Grande Apartments
  short_name: Casa Grande
  unit_count: 32
  street_address: TBD
  city: Harrison Township
  state: MI
  zip: TBD
  # One or two short sentences for the homepage introduction.
  introduction: >-
    A family-owned community of 32 apartments in Harrison Township,
    near Lake St. Clair. Quiet, well kept, and
    managed by the people who own it.
  # Main homepage photo (wide exterior shot works best).
  hero_photo: TBD
  # Optional links to listings elsewhere. Leave blank to hide.
  # The website always points visitors to Casa Grande directly first.
  other_listings:
    zillow: ""
    apartments_com: ""
    facebook: ""

contact:
  phone: "(586) 463-5616"
  email: livingcasagrande@gmail.com
  showing_note: Call or email to arrange a showing.

# Shown together, prominently, near the top of the homepage.
included_highlights:
  - title: Heat Included
    text: Heat is included in your monthly rent.
  - title: Water Included
    text: Water is included in your monthly rent.
  - title: Private Basement
    text: Every apartment has its own individually locked basement storage.

apartments:
  - id: one-bedroom
    name: One Bedroom
    bedrooms: 1
    bathrooms: TBD
    square_feet: TBD
    rent: 995                 # monthly, in dollars, numbers only
    rent_confirmed: false     # set to true once the rent above is current
    # Examples: "Available now", "Available December 1",
    # "Join the waitlist", "Call for availability"
    availability: Call for availability
    description: TBD
    floor_plan: TBD           # file name in src/assets/floorplans/
    photos: []                # list of files in src/assets/photos/

  - id: two-bedroom
    name: Two Bedroom
    bedrooms: 2
    bathrooms: TBD
    square_feet: TBD
    rent: 1140
    rent_confirmed: false
    availability: Call for availability
    description: TBD
    floor_plan: TBD
    photos: []

# Set confirmed: true only for features that apply to every apartment
# (or note the exception). Unconfirmed items are hidden at launch.
amenities:
  in_your_apartment:
    - name: Heat and water included
      confirmed: true
    - name: Central air conditioning
      confirmed: false
    - name: Full kitchen
      confirmed: false
    - name: Refrigerator
      confirmed: false
    - name: Stove
      confirmed: false
    - name: Dishwasher
      confirmed: false
    - name: Built-in microwave
      confirmed: false
    - name: Garbage disposal
      confirmed: false
  community:
    - name: Private, individually locked basement storage
      confirmed: true
    - name: On-site parking
      confirmed: true
    - name: Covered carports
      note: Optional
      confirmed: true
    - name: Cat-friendly
      confirmed: true
    - name: Community patio and outdoor seating
      confirmed: false

# Policy details shown on the Amenities page. Use TBD until confirmed.
policies:
  cats: TBD          # e.g. limit, deposit or monthly fee
  carports: TBD      # e.g. monthly cost, how to reserve
  parking: TBD       # e.g. assigned or open, guest parking

# Property photo gallery. Categories:
#   exterior, living, kitchens, bedrooms, bathrooms, basements, community
# alt: a short plain description for screen readers and search engines.
gallery: []
